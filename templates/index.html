<!DOCTYPE html>
<html>
<head>

<title>House Price Predictor</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right,#4facfe,#00f2fe);
    text-align:center;
    margin-top:100px;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:350px;
    margin:auto;
    box-shadow:0px 10px 25px rgba(0,0,0,0.2);
}

h1{
    color:#333;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    padding:10px 20px;
    background:#4facfe;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#008cff;
}

.result{
    margin-top:20px;
    font-size:20px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>🏠 House Price Predictor</h1>

<p>Welcome! Enter the details below to predict your house price.</p>

<form action="/predict" method="post">

<input type="text" name="size" placeholder="Enter House Size (sq ft)" required>

<input type="text" name="bedrooms" placeholder="Number of Bedrooms" required>

<br>

<button type="submit">Predict Price</button>

</form>

<div class="result">
{{ prediction_text }}
</div>

</div>

</body>
</html>
