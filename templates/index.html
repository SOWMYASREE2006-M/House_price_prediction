<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            width:350px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border-radius:5px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            padding:12px;
            background:#4facfe;
            border:none;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#2d8cf0;
        }

        .result{
            margin-top:20px;
            font-size:18px;
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏠 House Price Predictor</h1>

    <form action="/predict" method="post">

        <input type="number" name="area" placeholder="Area (sq ft)" required>

        <input type="number" name="bedrooms" placeholder="Bedrooms" required>

        <input type="number" name="bathrooms" placeholder="Bathrooms" required>

        <input type="number" name="floors" placeholder="Floors" required>

        <input type="number" name="age" placeholder="Age of House (years)" required>

        <input type="number" name="parking" placeholder="Parking Spaces" required>

        <button type="submit">Predict Price</button>

    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
